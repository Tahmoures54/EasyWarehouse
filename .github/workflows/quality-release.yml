name: Quality and Windows Release Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: ignore

  windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Build one-file EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AnbardariAsan --add-data "app/database/schema.sql;app/database" --add-data "assets;assets" app/main.py
      - name: Verify EXE exists and is non-empty
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AnbardariAsan.exe")) { throw "EXE was not created" }
          if ((Get-Item "dist/AnbardariAsan.exe").Length -le 100000) { throw "EXE is unexpectedly small" }
          Get-Item "dist/AnbardariAsan.exe" | Select-Object Name,Length
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AnbardariAsan-Windows-x64
          path: dist/AnbardariAsan.exe
          if-no-files-found: error
